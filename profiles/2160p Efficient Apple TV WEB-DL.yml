name: 2160p Efficient Apple TV WEB-DL
description: 'Apple TV-focused 2160p profile for high-quality source WEB-DLs.


  - Targets 2160p WEB-DL only (no WEBRip/Bluray/Remux paths)

  - Prioritizes Dolby Vision that is Apple TV-friendly (non-Profile 7 fallback handling)

  - Video preference: Dolby Vision > HDR10+ > HDR10 > SDR

  - Audio preference: DD+ Atmos > DD+ > Dolby Digital

  - Rejects TrueHD-only releases and hard-bans lossy-incompatible formats for Apple TV'
