name: 2160p-1080p Apple TV 4K 3rd Gen Priority Matrix
description: 'Strict Apple TV 4K (3rd Gen) profile with explicit 4K -> 1080p fallback ordering.

  Priority model:

  1) 2160p Dolby Vision (prefer Profile 5/8 signaling) + DD+ Atmos

  2) 2160p Dolby Vision + lossless/non-DD+ audio (TrueHD/DTS-HD MA/DTS:X)

  3) 2160p HDR10+ + DD+ Atmos

  4) 2160p HDR10+ + lossless/non-DD+ audio

  5) 2160p HDR10 + DD+ Atmos

  6) 2160p HDR10 + lossless/non-DD+ audio

  7) 2160p SDR + DD+ Atmos

  8) 2160p SDR + lossless/non-DD+ audio

  Then repeat same order for 1080p.

  This profile hard blocks anything below 1080p.'
tags:
- 2160p
- 1080p
- Apple TV 4K
- Priority Matrix
- No Sub-1080p
upgradesAllowed: true
minCustomFormatScore: 1000
upgradeUntilScore: 999999
minScoreIncrement: 1
